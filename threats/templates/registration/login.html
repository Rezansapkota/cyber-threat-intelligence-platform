<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            align-items: center;
            background: #f4f6f8;
            color: #17202a;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
        }

        .login-panel {
            background: #ffffff;
            border: 1px solid #d7dde4;
            border-radius: 8px;
            max-width: 380px;
            padding: 24px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 8px;
        }

        p {
            color: #52616f;
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 700;
        }

        input {
            border: 1px solid #b9c2cf;
            border-radius: 6px;
            box-sizing: border-box;
            font: inherit;
            padding: 10px;
            width: 100%;
        }

        button {
            border: 0;
            border-radius: 6px;
            background: #116466;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
            padding: 10px 14px;
        }

        .error {
            background: #fde8e8;
            border: 1px solid #f4b4b4;
            border-radius: 6px;
            color: #9b1c1c;
            padding: 10px;
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <h1>Sign In</h1>
        <p>Access the cyber threat intelligence dashboard.</p>

        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label>
                Username
                {{ form.username }}
            </label>
            <label>
                Password
                {{ form.password }}
            </label>
            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
