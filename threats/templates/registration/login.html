<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --background: #f6f7f9;
            --surface: #ffffff;
            --border: #d8dee6;
            --text: #1f2933;
            --muted: #667085;
            --accent: #52677a;
            --input-bg: #ffffff;
            --shadow: rgba(23, 32, 42, 0.12);
            --font-main: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            align-items: center;
            background: var(--background);
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.76), rgba(238, 241, 245, 0.72));
            box-sizing: border-box;
            color: var(--text);
            display: flex;
            font-family: var(--font-main);
            justify-content: center;
            line-height: 1.5;
            margin: 0;
            min-height: 100vh;
            padding: 32px;
        }

        .login-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 18px 44px var(--shadow);
            max-width: 380px;
            padding: 24px;
            width: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        p {
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 700;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            color: var(--text);
            font: inherit;
            padding: 10px;
            transition: border-color 180ms ease, box-shadow 180ms ease;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(17, 100, 102, 0.16);
            outline: 0;
        }

        button {
            background: var(--accent);
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font-weight: 700;
            padding: 10px 14px;
        }

        .error {
            background: #fde8e8;
            border: 1px solid #f4b4b4;
            border-radius: 6px;
            color: #9b1c1c;
            padding: 10px;
        }
    </style>
</head>
<body>
    <!-- Login card rendered by Django's built-in LoginView. -->
    <main class="login-panel">
        <h1>Cyber Threat Intelligence Platform</h1>
        <p>Sign in to access the intelligence dashboard.</p>

        <!-- Django adds form errors after a failed login attempt. -->
        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}

        <form method="post">
            <!-- CSRF protects the login POST from cross-site form submissions. -->
            {% csrf_token %}
            <!-- Preserve the protected page URL so login can redirect back. -->
            <input type="hidden" name="next" value="{{ next }}">
            <label>
                Username
                {{ form.username }}
            </label>
            <label>
                Password
                {{ form.password }}
            </label>
            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
